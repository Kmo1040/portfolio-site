<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <h1>Monthly Budget Tracker</h1>

        <div class="income-section glass-panel">
            <h2>Income</h2>
            <input type="number" id="income" placeholder="Monthly Income">
            <button id="save-income">Save</button>
            <div class="totals">
                <p>Total Bills: $<span id="total-bills">0.00</span></p>
                <p>Remaining: $<span id="remaining">0.00</span></p>
            </div>
        </div>

        <div class="add-bill-section glass-panel">
            <h2>Add Bills</h2>
            <input type="text" id="bill-name" placeholder="Bill Name">
            <input type="date" id="bill-date">
            <input type="number" id="bill-amount" placeholder="Amount">
            <input type="text" id="bill-notes" placeholder="Notes (optional)">
            <label>
                <input type="checkbox" id="bill-autopay"> Autopay
            </label>
            <button id="add-bill">Add Bill</button>
        </div>

        <div class="controls">
            <label><input type="checkbox" id="toggle-paid">Show Paid Bills</label>
            <button id="export-csv">Export CSV</button>
            <button id="reset-month">New Month</button>
        </div>

        <table id="bill-table" class="glass-panel">
            <thead>
                <tr>
                    <th>Bill</th>
                    <th>Due</th>
                    <th>Amount</th>
                    <th>Notes</th>
                    <th>Autopay</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="bill-list"></tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
