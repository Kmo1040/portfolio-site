<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <h1>Monthly Budget Tracker</h1>

        <div class="add-bill-form glass-box">
            <input type="text" id="bill-name" placeholder="Bill Name">
            <input type="date" id="bill-date">
            <input type="number" id="bill-amount" placeholder="Amount">
            <label>
                <input type="checkbox" id="bill-autopay"> Autopay
            </label>
            <button id="add-bill">Add Bill</button>
        </div>

        <div class="summary glass-box">
            <p><strong>Total:</strong> $<span id="total-amount">0.00</span></p>
            <p><strong>Upcoming:</strong> <span id="due-soon-count"></span></p>
        </div>

        <div class="bill-list glass-box">
            <table>
                <thead>
                    <tr>
                        <th>Bill</th>
                        <th>Due Date</th>
                        <th>Amount</th>
                        <th>Autopay</th>
                        <th>Paid</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="bill-table-body">

                </tbody>
            </table>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
